name: Snapshot af spillesteder (fejlsøgning)
on:
  push:
    branches: [debug/snapshot]
    paths: [debug/**, .github/workflows/snapshot.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node debug/snapshot.mjs
      - run: |
          git config user.name "Encore snapshot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots
          git commit -m "Snapshots af spillesteder [skip ci]" || echo "intet nyt"
          git push
